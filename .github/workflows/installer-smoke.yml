name: installer-smoke

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux-installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install from public GitHub script
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/Josepavese/needlex/main/install/install.sh | bash
          curl -fsSL https://raw.githubusercontent.com/Josepavese/needlex/main/install/install.sh | bash

      - name: Verify installed command and state root
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.profile" >/dev/null 2>&1 || true
          source "${HOME}/.bashrc" >/dev/null 2>&1 || true
          command -v needlex
          test -x "${HOME}/.local/bin/needlex"
          state_root="${HOME}/.local/share/needlex"
          test -d "${state_root}"
          test -d "${state_root}/traces"
          test -d "${state_root}/proofs"
          test -d "${state_root}/fingerprints"
          test -d "${state_root}/genome"
          test -d "${state_root}/logs"
          test -d "${state_root}/configs"
          test -d "${state_root}/candidates"
          test -d "${state_root}/domain_graph"
          test -d "${state_root}/fingerprint_graph"
          test -d "${state_root}/browsers"
          test -f "${state_root}/discovery/discovery.db"
          test -f "${state_root}/configs/needlex.json"
          test ! -e "${HOME}/.local/bin/needle"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = Path.home() / ".profile"
          text = profile.read_text() if profile.exists() else ""
          assert text.count("# needlex-path") == 1, text
          state_root = Path.home() / ".local" / "share" / "needlex"
          cfg = json.loads((state_root / "configs" / "needlex.json").read_text())
          browser_path = Path(cfg["render"]["browser_path"])
          assert cfg["render"]["enabled"] is True, cfg["render"]
          assert browser_path.exists(), browser_path
          assert os.access(browser_path, os.X_OK), browser_path
          assert state_root in browser_path.parents, browser_path
          print("path hook deduped")
          PY

      - name: Smoke CLI
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.profile" >/dev/null 2>&1 || true
          source "${HOME}/.bashrc" >/dev/null 2>&1 || true
          needlex memory stats --json
          needlex config show --json
          needlex doctor --json > /tmp/needlex-doctor.json
          needlex logs stats --json
          needlex support bundle --out /tmp/needlex-support --json
          needlex read https://example.com --json > /tmp/needlex-read.json
          python3 - <<'PY'
          import json
          doctor = json.load(open("/tmp/needlex-doctor.json"))
          assert doctor["render"]["enabled"] is True, doctor["render"]
          assert doctor["render"]["ready"] is True, doctor["render"]
          payload = json.load(open("/tmp/needlex-read.json"))
          assert payload.get("url"), "missing url"
          assert payload.get("summary"), "missing summary"
          print("read smoke ok")
          PY

      - name: Smoke MCP stdio
        shell: bash
        run: |
          set -euo pipefail
          source "${HOME}/.profile" >/dev/null 2>&1 || true
          source "${HOME}/.bashrc" >/dev/null 2>&1 || true
          set +e
          timeout 2s needlex mcp >/tmp/needlex-mcp.out 2>/tmp/needlex-mcp.err
          code=$?
          set -e
          if [[ "${code}" != "0" && "${code}" != "124" ]]; then
            cat /tmp/needlex-mcp.err
            exit "${code}"
          fi
